name: Deploy to IONOS (Leiter)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ionos-leiter
  cancel-in-progress: true

env:
  IONOS_SSH_HOST: access-5019302200.webspace-host.com
  IONOS_SSH_USERNAME: su1149847
  IONOS_SSH_PATH: Leiter

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          IONOS_STANDALONE: "1"
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://leiter.fr' }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

      - name: Prepare Apache static mirror
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://leiter.fr' }}
        run: |
          mkdir -p .ionos-deploy/_next/static
          cp -a .next/standalone/. .ionos-deploy/
          mkdir -p .ionos-deploy/.next
          cp -a .next/static .ionos-deploy/.next/static
          if [ -d public ]; then cp -a public .ionos-deploy/public; cp -a public/. .ionos-deploy/; fi
          cp -a .next/static/. .ionos-deploy/_next/static/
          printf '%s\n' "Leiter deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .ionos-deploy/DEPLOY.txt

          cd .ionos-deploy
          export PORT=3457 HOSTNAME=localhost NODE_ENV=production
          export NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL:-https://leiter.fr}"
          node server.js > /tmp/leiter-serve.log 2>&1 &
          echo $! > /tmp/leiter-serve.pid
          for i in $(seq 1 40); do
            if curl -sf "http://localhost:3457/" >/dev/null; then break; fi
            sleep 1
          done

          mirror() {
            local url="$1" dest="$2"
            mkdir -p "$(dirname "$dest")"
            if curl -sf "http://localhost:3457$url" -o "$dest"; then
              echo "mirrored $url -> $dest"
            else
              echo "FAIL $url" >&2
            fi
          }

          mirror "/" "index.html"
          mirror "/preise" "preise/index.html"
          mirror "/impressum" "impressum/index.html"
          mirror "/datenschutz" "datenschutz/index.html"
          mirror "/agb" "agb/index.html"
          mirror "/kasse/erfolg" "kasse/erfolg/index.html"
          mirror "/kasse/abgebrochen" "kasse/abgebrochen/index.html"

          test -f index.html
          test -f app-proxy.php

          cat > .htaccess <<'EOF'
          DirectoryIndex index.html
          Options -Indexes
          RewriteEngine On
          RewriteRule ^api(/.*)?$ app-proxy.php [QSA,L]
          RewriteCond %{REQUEST_FILENAME} -f [OR]
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteRule ^ - [L]
          EOF

          kill "$(cat /tmp/leiter-serve.pid)" || true

      - name: Write runtime env
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://leiter.fr' }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          site = os.environ.get("NEXT_PUBLIC_SITE_URL") or "https://leiter.fr"
          lines = ["NODE_ENV=production", f"NEXT_PUBLIC_SITE_URL={site}"]
          for key in ("STRIPE_SECRET_KEY", "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY", "ADMIN_TOKEN"):
              value = os.environ.get(key, "").strip()
              if value:
                  lines.append(f"{key}={value}")
          with open(".ionos-deploy/.env", "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Ensure remote directory exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.IONOS_SSH_HOST }}
          username: ${{ env.IONOS_SSH_USERNAME }}
          password: ${{ secrets.IONOS_SSH_PASSWORD }}
          port: 22
          script: |
            mkdir -p ${{ env.IONOS_SSH_PATH }}

      - name: Deploy to IONOS via rsync
        env:
          SSHPASS: ${{ secrets.IONOS_SSH_PASSWORD }}
        run: |
          if [ -z "$SSHPASS" ]; then
            echo "::error::Add repository secret IONOS_SSH_PASSWORD for user su1149847."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync
          sshpass -e rsync -avz \
            -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30" \
            .ionos-deploy/ \
            "${{ env.IONOS_SSH_USERNAME }}@${{ env.IONOS_SSH_HOST }}:${{ env.IONOS_SSH_PATH }}/"
