name: Deploy to IONOS (Leiter)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ionos-leiter
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          IONOS_STANDALONE: "1"
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://leiter.be' }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

      - name: Prepare Apache static mirror
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://leiter.be' }}
        run: |
          mkdir -p .ionos-deploy/_next/static
          cp -a .next/standalone/. .ionos-deploy/
          mkdir -p .ionos-deploy/.next
          cp -a .next/static .ionos-deploy/.next/static
          if [ -d public ]; then cp -a public .ionos-deploy/public; cp -a public/. .ionos-deploy/; fi
          cp -a .next/static/. .ionos-deploy/_next/static/
          printf '%s\n' "Leiter deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .ionos-deploy/DEPLOY.txt

          cd .ionos-deploy
          export PORT=3457 HOSTNAME=localhost NODE_ENV=production
          export NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL:-https://leiter.be}"
          node server.js > /tmp/leiter-serve.log 2>&1 &
          echo $! > /tmp/leiter-serve.pid
          for i in $(seq 1 40); do
            if curl -sf "http://localhost:3457/" >/dev/null; then break; fi
            sleep 1
          done

          mirror() {
            local url="$1" dest="$2"
            mkdir -p "$(dirname "$dest")"
            if curl -sf "http://localhost:3457$url" -o "$dest"; then
              echo "mirrored $url -> $dest"
            else
              echo "FAIL $url" >&2
            fi
          }

          mirror "/" "index.html"
          mirror "/preise" "preise/index.html"
          mirror "/impressum" "impressum/index.html"
          mirror "/datenschutz" "datenschutz/index.html"
          mirror "/agb" "agb/index.html"
          mirror "/kasse/erfolg" "kasse/erfolg/index.html"
          mirror "/kasse/abgebrochen" "kasse/abgebrochen/index.html"

          cat > .htaccess <<'EOF'
          DirectoryIndex index.html
          Options -Indexes
          RewriteEngine On
          RewriteRule ^api(/.*)?$ app-proxy.php [QSA,L]
          RewriteCond %{REQUEST_FILENAME} -f [OR]
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteRule ^ - [L]
          EOF

          kill "$(cat /tmp/leiter-serve.pid)" || true

      - name: Write runtime env and zip
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://leiter.be' }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          site = os.environ.get("NEXT_PUBLIC_SITE_URL") or "https://leiter.be"
          lines = ["NODE_ENV=production", f"NEXT_PUBLIC_SITE_URL={site}"]
          for key in ("STRIPE_SECRET_KEY", "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY", "ADMIN_TOKEN"):
              value = os.environ.get(key, "").strip()
              if value:
                  lines.append(f"{key}={value}")
          with open(".ionos-deploy/.env", "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
          (cd .ionos-deploy && zip -r -q ../leiter-deploy.zip .)
          ls -lh leiter-deploy.zip

      - name: Deploy zip via SFTP + SSH unzip
        env:
          IONOS_FTP_HOST: ${{ secrets.IONOS_FTP_HOST }}
          IONOS_FTP_USER: ${{ secrets.IONOS_FTP_USER }}
          IONOS_FTP_PASSWORD: ${{ secrets.IONOS_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -p "$IONOS_FTP_PASSWORD" sftp -o StrictHostKeyChecking=no -P 22 "$IONOS_FTP_USER@$IONOS_FTP_HOST" <<'EOF'
          mkdir Leiter
          put leiter-deploy.zip Leiter/deploy.zip
          bye
          EOF
          sshpass -p "$IONOS_FTP_PASSWORD" ssh -o StrictHostKeyChecking=no -p 22 "$IONOS_FTP_USER@$IONOS_FTP_HOST" \
            'cd Leiter && unzip -oq deploy.zip && rm -f deploy.zip && mkdir -p _app && cp -f server.js package.json _app/ && if [ -f .env ]; then cp -f .env _app/.env; fi && rm -rf _app/.next && cp -a .next _app/.next && if [ -d public ]; then cp -a public _app/; fi && test -f index.html && echo DEPLOY_OK'
